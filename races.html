<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会・記録会 | 青山学院大学 陸上競技部</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-site-header></header>

<main>
  <div class="breadcrumb"><a href="index.html">概況</a> / 大会・記録会</div>
  <section class="page-head">
    <h1>大会・記録会</h1>
    <p>青学が出場した大会・記録会・駅伝の一覧です。年度はシーズン（4/1〜翌3/31）単位なので、1月の箱根は前の年度に入ります。年度を選ぶと月ごとの件数が出るので、月をクリックして絞り込めます。</p>
  </section>

  <div class="tabs" id="tabs">
    <button data-tab="competition" class="active">トラック・ロード</button>
    <button data-tab="ekiden">駅伝</button>
  </div>

  <section class="controls">
    <div class="field"><label>年</label><select id="year"></select></div>
    <div class="field" style="flex:1;min-width:220px"><label>検索</label><input type="search" id="q" placeholder="大会名で検索"></div>
    <div class="field" style="margin-left:auto;align-self:flex-end"><span class="hint" id="count" style="color:var(--muted);font-size:12px"></span></div>
  </section>

  <section class="controls" id="monthBar">
    <div class="field" style="flex:1;min-width:100%">
      <label>月</label>
      <div class="pill-row" id="months"></div>
    </div>
  </section>

  <div class="card pad-0" id="out"></div>
</main>

<footer data-site-footer></footer>

<script type="module">
import { loadStore, academicYear } from "./assets/store.js";
import { mountLayout, setGeneratedAt, renderTable, fmtDate, qs, esc, attachSuggestions } from "./assets/ui.js";

const store = await loadStore();
mountLayout("races.html");
setGeneratedAt(store.generatedAt);

let tab = qs("tab") === "ekiden" ? "ekiden" : "competition";
const $year = document.getElementById("year");
const $q = document.getElementById("q");
const $months = document.getElementById("months");
const $monthBar = document.getElementById("monthBar");
// "" = 年間（その年の全部）
// "" = シーズン全部、それ以外は "2026-01" のような年月
let month = /^\d{4}-\d{1,2}$/.test(qs("month") || "")
  ? qs("month").replace(/^(\d{4})-(\d)$/, "$1-0$2") : "";

function all() {
  return tab === "ekiden" ? store.ekidenRoundsSorted : store.competitionsSorted;
}

function fillYears() {
  // 「年度」＝シーズン（4/1〜翌3/31）。1月の箱根は前年度に入る。
  const seasons = [...new Set(all().map((r) => academicYear(r.date)).filter(Boolean))].sort((a, b) => b - a);
  const prev = $year.value;
  $year.innerHTML = `<option value="">すべての年度</option>`
    + seasons.map((y) => `<option value="${y}">${y}年度</option>`).join("");
  const want = qs("year");
  const has = (v) => seasons.includes(Number(v));
  // 初期表示は最新年度（URL で ?year= が来ていればそれ）
  $year.value = has(prev) ? prev : (want && has(want) ? want : (seasons[0] ?? ""));
}

/** シーズンの月（4月→翌3月）ごとの件数。value は "2025-04" のような年月 */
function seasonMonths(season) {
  const y = Number(season);
  const out = [];
  for (let m = 4; m <= 12; m++) out.push({ key: `${y}-${String(m).padStart(2, "0")}`, label: `${m}月` });
  for (let m = 1; m <= 3; m++) out.push({ key: `${y + 1}-${String(m).padStart(2, "0")}`, label: `${m}月` });
  return out;
}

/** 月ボタン（公式サイトの「4月・5月…」の索引と同じ役割） */
function fillMonths() {
  const y = $year.value;
  if (!y) { $monthBar.hidden = true; $months.innerHTML = ""; return; }
  $monthBar.hidden = false;
  const months = seasonMonths(y);
  const counts = new Map(months.map((m) => [m.key, 0]));
  let total = 0;
  for (const r of all()) {
    if (academicYear(r.date) !== Number(y)) continue;
    total++;
    const key = (r.date || "").slice(0, 7);
    if (counts.has(key)) counts.set(key, counts.get(key) + 1);
  }
  const btn = (val, text, n) =>
    `<button class="btn ghost ${val === month ? "active" : ""}" data-m="${val}"
      style="${n ? "" : "opacity:.45"}">${text}<span style="opacity:.6;margin-left:5px">${n}</span></button>`;
  $months.innerHTML = btn("", "シーズン", total)
    + months.map((m) => btn(m.key, m.label, counts.get(m.key) || 0)).join("");
  $months.querySelectorAll("[data-m]").forEach((b) =>
    b.addEventListener("click", () => { month = b.dataset.m; fillMonths(); render(); }));
}

function label(r) {
  if (tab === "ekiden") {
    const item = store.ekidenItemById.get(r.ekidenItemId);
    return `${item ? item.name : "駅伝"} ${r.round}`;
  }
  // 大会名にすでに「第N回」が入っているときは二重に書かない
  return r.round && !r.name.includes(r.round) ? `${r.name} ${r.round}` : r.name;
}

function rows() {
  const y = $year.value;
  const q = $q.value.trim().toLowerCase();
  return all().filter((r) => {
    if (y && academicYear(r.date) !== Number(y)) return false;
    if (y && month && (r.date || "").slice(0, 7) !== month) return false;
    if (q && !label(r).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const list = rows();
  const scope = [tab === "ekiden" ? "駅伝" : "大会",
    $year.value ? `${$year.value}年度` : "全期間",
    month ? `${month.slice(0, 4)}年${Number(month.slice(5))}月` : ""].filter(Boolean).join(" ／ ");
  document.getElementById("count").textContent = `${scope}：${list.length} 件`;
  const out = document.getElementById("out");
  out.textContent = "";
  if (tab === "competition") {
    renderTable(out, [
      { label: "日付", cls: "mid", render: (r) => fmtDate(r.date) },
      { label: "大会名", cls: "name", render: (r) => `<a href="race.html?type=competition&id=${r.id}">${esc(label(r))}</a>` },
      // 駅伝は competition_record ではなく ekiden_record に入っているので、そちらの件数を出す
      { label: "記録数", cls: "num", render: (r) => {
        const n = (store.recordsByCompetition.get(r.id) || []).length;
        if (n) return n;
        const k = r.ekidenRoundId ? (store.ekidenRecordsByRound.get(r.ekidenRoundId) || []).length : 0;
        return k ? `${k} <span class="badge">駅伝</span>` : "0";
      } },
      {
        label: "主な種目", render: (r) => {
          const items = [...new Set((store.recordsByCompetition.get(r.id) || []).map((x) => x.item))];
          return items.slice(0, 4).map((i) => `<span class="badge">${store.itemLabel(i)}</span>`).join(" ") || "—";
        },
      },
      {
        label: "最高順位", cls: "mid", render: (r) => {
          const recs = (store.recordsByCompetition.get(r.id) || []).filter((x) => x.rank);
          if (!recs.length) return "—";
          const best = Math.min(...recs.map((x) => x.rank));
          return `<span class="badge ${best === 1 ? "gold" : ""}">${best}位</span>`;
        },
      },
    ], list, { empty: "該当する大会がありません" });
  } else {
    renderTable(out, [
      { label: "日付", cls: "mid", render: (r) => fmtDate(r.date) },
      { label: "大会", cls: "name", render: (r) => `<a href="race.html?type=ekiden&id=${r.id}">${esc(label(r))}</a>` },
      { label: "区間数", cls: "mid", render: (r) => r.intervalCount || (store.ekidenRecordsByRound.get(r.id) || []).length || "—" },
      { label: "区間賞", cls: "mid", render: (r) => {
        const n = (store.ekidenRecordsByRound.get(r.id) || []).filter((x) => x.rank === 1).length;
        return n ? `<span class="badge gold">${n}</span>` : "—";
      } },
      { label: "チーム順位", cls: "mid", render: (r) => {
        const recs = store.ekidenRecordsByRound.get(r.id) || [];
        const ranks = recs.map((x) => x.teamRank).filter((x) => x != null);
        return ranks.length ? `${Math.max(...ranks)}位` : "—";
      } },
    ], list, { empty: "該当する駅伝がありません" });
  }
}

document.querySelectorAll("#tabs button").forEach((b) => {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
    month = "";
    fillYears();
    fillMonths();
    render();
  });
});
$year.addEventListener("change", () => { month = ""; fillMonths(); render(); });
$q.addEventListener("input", render);

// 大会名候选词（随标签页切换重建）
function refreshSuggestions() {
  attachSuggestions($q, [...all().map(label), ...store.competitions.map((c) => c.name)]);
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", refreshSuggestions));
refreshSuggestions();
if (tab === "ekiden") document.querySelector('[data-tab="ekiden"]').classList.add("active"), document.querySelector('[data-tab="competition"]').classList.remove("active");
fillYears();
fillMonths();
render();
</script>
</body>
</html>
