<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三大駅伝 出場者 | 青山学院大学 陸上競技部</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header data-site-header></header>

<main>
  <div class="breadcrumb"><a href="index.html">概況</a> / 三大駅伝 出場者</div>
  <section class="page-head">
    <h1>三大駅伝 出場者</h1>
    <p>箱根・全日本・出雲に一度でも出場した選手を、学年ごとにまとめました。区間1〜3位は色付き、区間新記録は赤字です。</p>
  </section>

  <section class="controls">
    <div class="field">
      <label>性別</label>
      <div class="pill-row" id="sexTabs"></div>
    </div>
    <div class="field">
      <label>対象</label>
      <select id="scope">
        <option value="all">歴代全員</option>
        <option value="active">現役のみ</option>
      </select>
    </div>
    <div class="field">
      <label>入学年</label>
      <select id="year"><option value="">すべて</option></select>
    </div>
    <div class="field">
      <label>並び順</label>
      <select id="sort">
        <option value="year">入学年（新しい順）</option>
        <option value="runs">出走回数（多い順）</option>
        <option value="name">氏名順</option>
      </select>
    </div>
    <div class="field" style="flex:1;min-width:180px">
      <label>検索</label>
      <input type="search" id="q" placeholder="氏名で検索">
    </div>
    <div class="field" style="margin-left:auto;align-self:flex-end">
      <span class="hint" id="count" style="font-size:12px"></span>
    </div>
  </section>

  <section class="card" style="margin-bottom:14px;padding:12px 16px">
    <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center">
      <span>区間順位：<b class="ek-key r1">1位</b> <b class="ek-key r2">2位</b> <b class="ek-key r3">3位</b> ／ 4位以下は色なし</span>
      <span><b style="color:var(--danger)">赤字</b>＝区間新記録</span>
      <span id="coverage"></span>
    </div>
  </section>

  <div id="out" class="ek-grid"></div>
</main>

<footer data-site-footer></footer>

<script type="module">
import { loadStore } from "./assets/store.js";
import { mountLayout, setGeneratedAt, gradeLabel, esc, qs, attachSuggestions } from "./assets/ui.js";
import { MAJOR_RELAYS, majorRecords, ekidenMatrixHtml } from "./assets/ekiden-matrix.js";
import { scoreText } from "./assets/store.js";

const store = await loadStore();
mountLayout("ekiden-members.html");
setGeneratedAt(store.generatedAt);

const todayISO = new Date().toISOString().slice(0, 10);
const activeIds = new Set(store.rosterAsOf(todayISO).map((s) => s.id));

const $ = (id) => document.getElementById(id);
let sex = qs("sex") === "女" ? "女" : "男";

/** 三大驿传に出場した選手（出場回数つき） */
function collect() {
  const relayItemIds = MAJOR_RELAYS.map((r) => {
    const item = store.ekidenItems.find((i) => r.match.test(i.name));
    return { ...r, itemId: item ? item.id : null };
  });
  const byStudent = new Map();
  for (const s of store.students) {
    const list = majorRecords(store, s.id);
    if (!list.length) continue;
    const count = {};
    for (const x of list) count[x.relay] = (count[x.relay] || 0) + 1;
    byStudent.set(s.id, { student: s, count });
  }
  return { byStudent, relayItemIds };
}

/** 収録範囲（何回からデータがあるか） */
function renderCoverage(relayItemIds) {
  const parts = relayItemIds.map(({ key, itemId }) => {
    const rounds = store.ekidenRounds.filter((r) => r.ekidenItemId === itemId);
    if (!rounds.length) return null;
    const first = rounds.slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))[0];
    return `${key} ${first.round}（${String(first.date).slice(0, 4)}年）〜`;
  }).filter(Boolean);
  $("coverage").innerHTML = `収録データ：${esc(parts.join(" ／ "))}`;
}

function fillSexTabs() {
  const n = (k) => store.studentsBySex(k).length;
  $("sexTabs").innerHTML = ["男", "女"].map((k) =>
    `<button type="button" class="btn ghost${k === sex ? " active" : ""}" data-sex="${k}">${k === "男" ? "男子" : "女子"} <span style="opacity:.6">${n(k)}</span></button>`
  ).join("");
  $("sexTabs").querySelectorAll("[data-sex]").forEach((b) =>
    b.addEventListener("click", () => { sex = b.dataset.sex; fillSexTabs(); fillYears(); render(); }));
}

function list() {
  const { byStudent } = collect();
  let rows = [...byStudent.values()];
  rows = rows.filter((x) => (x.student.sex || "男") === sex);
  if ($("scope").value === "active") rows = rows.filter((x) => activeIds.has(x.student.id));
  const y = $("year").value;
  if (y) rows = rows.filter((x) => String(x.student.enrollmentYear) === y);
  const q = $("q").value.trim().toLowerCase();
  if (q) rows = rows.filter((x) => (x.student.name + (x.student.kanaName || "")).toLowerCase().includes(q));
  // 三大駅伝の合計出走回数
  const runs = (x) => MAJOR_RELAYS.reduce((n, r) => n + (x.count[r.key] || 0), 0);
  const byYear = (a, b) => String(b.student.enrollmentYear || "").localeCompare(String(a.student.enrollmentYear || ""))
    || a.student.name.localeCompare(b.student.name, "ja");
  const mode = $("sort").value;
  if (mode === "runs") return rows.sort((a, b) => runs(b) - runs(a) || byYear(a, b));
  if (mode === "name") return rows.sort((a, b) => a.student.name.localeCompare(b.student.name, "ja"));
  return rows.sort(byYear);
}

function fillYears() {
  const years = [...new Set(store.studentsBySex(sex).map((s) => s.enrollmentYear).filter(Boolean))].sort().reverse();
  const cur = $("year").value;
  $("year").innerHTML = `<option value="">すべて</option>` + years.map((y) => `<option value="${y}">${y}年</option>`).join("");
  if (years.includes(cur)) $("year").value = cur;
}

function render() {
  const rows = list();
  $("count").textContent = `${rows.length} 名`;
  // 検索候補は「いま下に出ている選手」だけ
  attachSuggestions($("q"), rows.map((x) => x.student.name), { limit: 2000 });
  const out = $("out");
  out.textContent = "";
  if (!rows.length) { out.innerHTML = `<div class="card empty">該当する選手がいません</div>`; return; }

  for (const { student, count } of rows) {
    const counts = MAJOR_RELAYS.map((r) => count[r.key] ? `${r.key}${count[r.key]}回` : null)
      .filter(Boolean).join("・");
    // 5000 / 10000 / ハーフ は在学中の自己ベスト、高校PB は入学時5000m（无ければ高校時代の記録）
    const bestOf = (item) => store.pbAsOf(student.id, item, null, { include: "enrolled" });
    const hsRec = (store.recordsByStudent.get(student.id) || [])
      .find((x) => x.item === "five_5000m" && /高校時代/.test((x.remark || "") + (x.competitionName || "")));
    const hsPb = student.enrollment5000m || (hsRec ? scoreText(hsRec) : null);
    const pbText = (rec) => (rec ? scoreText(rec) : "—");
    const infoRows = [
      ["5000m", pbText(bestOf("five_5000m"))],
      ["10000m", pbText(bestOf("ten_10000m"))],
      ["ハーフ", pbText(bestOf("half_marathon"))],
      ["高校PB", hsPb || "—"],
    ].map(([label, v]) => `<span><b>${label}</b>${esc(v)}</span>`).join("");

    const card = document.createElement("section");
    card.className = "card pad-0 ek-card";
    card.innerHTML = `<div class="card-title" style="padding:12px 12px 0">
        <h3><a href="player.html?id=${student.id}">${esc(student.name)}</a></h3>
        <span class="hint">${student.enrollmentYear || "—"}年入学${(student.sex || "男") === "女" ? " ／ 女子" : ""}
          ／ ${activeIds.has(student.id) ? gradeLabel(store.gradeAt(student, todayISO)) || "在籍" : "OB"}${counts ? ` ／ ${esc(counts)}` : ""}</span>
      </div>
      <div class="ek-info">${infoRows}</div>
      <div style="padding:0 8px 10px">${ekidenMatrixHtml(store, student.id)}</div>`;
    out.append(card);
  }
}

$("scope").addEventListener("change", render);
$("year").addEventListener("change", render);
$("sort").addEventListener("change", render);
$("q").addEventListener("input", render);
document.addEventListener("langchange", () => render());

const { relayItemIds } = collect();
renderCoverage(relayItemIds);
fillSexTabs();
fillYears();
render();
</script>
</body>
</html>
